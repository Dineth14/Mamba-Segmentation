# configs/mambavision.yaml
# MambaVision encoder — LoveDA dataset
# Variants: tiny | tiny2 | small | base | large | large2
#
# Backbone weights go in: MambaVision/weights/1k/
#   mambavision_tiny_1k.pth.tar, mambavision_small_1k.pth.tar, etc.
#   Download from https://github.com/NVlabs/MambaVision
#
# Usage:
#   python train.py --config configs/mambavision.yaml
#   python train.py --config configs/mambavision.yaml variant=small

extends: base.yaml

backbone: mambavision
variant: base   # tiny | tiny2 | small | base | large | large2

output_dir: Comparison_Experiments/mambavision_base_512

encoder_kwargs:
  model_variant: base
  depths: [3, 3, 10, 5]
  dims: [128, 256, 512, 1024]
  drop_path_rate: 0.3
  pretrained: true
  weights_path: auto  # resolved to MambaVision/weights/1k/mambavision_base_1k.pth.tar
