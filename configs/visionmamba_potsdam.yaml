# configs/visionmamba_potsdam.yaml
# Vision Mamba (Vim) encoder — ISPRS Potsdam (ICPRS) dataset
#
# Usage:
#   python train.py --config configs/visionmamba_potsdam.yaml

extends: base.yaml

backbone: visionmamba
variant: base

dataset: icprs
data_root: ${POTSDAM_ROOT:data/Potsdam}
num_classes: 6
class_names:
  - Impervious
  - Building
  - LowVeg
  - Tree
  - Car
  - Clutter

train_img_dirs: [Images]
train_mask_dirs: [Labels]
val_img_dirs: [Images]
val_mask_dirs: [Labels]

output_dir: Comparison_Experiments_ICPRS_potsdam/visionmamba_base_512

encoder_kwargs:
  variant: base
  depths: [1]
  dims: [768]
  drop_path_rate: 0.0
  pretrained: true
  weights_path: auto

batch_size: 8
crop_size: 32
max_iters: 250
val_interval: 250
