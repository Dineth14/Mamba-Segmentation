# configs/cnn_unet.yaml
# CNN ResNet50 backbone (U-Net style) — LoveDA dataset
#
# Backbone weights go in: weights/imagenet/
#   resnet50-11ad3fa6.pth
#
# Usage:
#   python train.py --config configs/cnn_unet.yaml

extends: base.yaml

backbone: cnn
variant: resnet50

output_dir: Comparison_Experiments/cnn_unet_r50_512

encoder_kwargs:
  depth: 50
  pretrained: true
  weights_path: ${WEIGHTS_ROOT:weights}/imagenet/resnet50-11ad3fa6.pth
